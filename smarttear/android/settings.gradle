pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localProperties = file("local.properties")
        if (!localProperties.exists()) {
            throw new RuntimeException(
                "Missing android/local.properties.\n" +
                "Run 'flutter pub get' or 'flutter run' from the smarttear/ directory to generate it,\n" +
                "or create android/local.properties with:\n" +
                "flutter.sdk=<path to your Flutter SDK>\n"
            )
        }
        localProperties.withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            throw new RuntimeException(
                "flutter.sdk not set in android/local.properties.\n" +
                "Set:\n" +
                "flutter.sdk=<path to your Flutter SDK>\n"
            )
        }
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.0" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.0" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "1.9.10" apply false
}

include ":app"
